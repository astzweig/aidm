name: Validate AIDM examples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate examples
        run: |
          for f in .aidm.json examples/*.aidm.json; do
            python tools/check-declaration.py "$f"
          done
